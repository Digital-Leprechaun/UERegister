name: Build and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Debug
        run: msbuild UERegister.sln /t:Rebuild /p:Configuration=Debug /v:minimal /nologo
      - name: Build Release, test and package
        run: msbuild UERegister/UERegister.csproj /t:Rebuild /p:Configuration=Release /v:minimal /nologo
      - uses: actions/upload-artifact@v4
        with:
          name: UERegister-unsigned
          path: Releases/*/*
          if-no-files-found: error
